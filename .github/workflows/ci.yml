name: CI
on:
  push:
    branches: [main, go-port]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test (server packages, no desktop shell)
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          go test ./...
      - name: Vet and test (with the desktop shell)
        if: runner.os != 'Linux'
        run: |
          go vet -tags desktop ./...
          go test -tags desktop ./...
      - uses: dominikh/staticcheck-action@v1
        if: runner.os == 'Linux'
        with:
          version: latest
          install-go: false
      - uses: actions/setup-node@v4
        if: runner.os == 'Linux'
        with:
          node-version: 24
          cache: npm
      - name: UI lint and unit tests
        if: runner.os == 'Linux'
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run test:ui
  package-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go run ./cmd/buildtool package --os windows
      - name: Smoke test the build
        shell: pwsh
        env:
          RUBBAN_DISABLE_UPDATES: '1'
        run: |
          $zip = Get-ChildItem release -Filter 'Rubban-*-Windows-x64.zip' | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath smoke
          $exe = (Get-ChildItem smoke -Recurse -Filter Rubban.exe | Select-Object -First 1).FullName
          $env:RUBBAN_DATA_DIR = "$PWD\smoke-data"
          $env:RUBBAN_SMOKE_DIR = "$PWD\smoke-out"
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Rubban --smoke-test exited with $($process.ExitCode)" }
          $result = Get-Content smoke-out/desktop-smoke.json -Raw | ConvertFrom-Json
          if ($result.rendererErrors.Count -ne 0) { throw "Renderer errors: $($result.rendererErrors -join '; ')" }
          Write-Host "Smoke test passed: '$($result.title)', $($result.bodyLength) characters of page text"
