name: Build and release
# The only workflow. Run it by hand from the Actions tab on the branch to release: it builds the
# Windows and macOS zips from the VERSION file and, unless "publish" is turned off, publishes them
# as GitHub Release v<VERSION> tagged at the chosen commit.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish GitHub Release v<VERSION> at this commit (off = build only; the zips stay as workflow artifacts)
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - id: version
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          # Fails unless CHANGELOG.md has a "## <version>" section.
          go run ./cmd/buildtool release-notes "$version" > /dev/null
          if [ "$PUBLISH" = "true" ]; then
            existing=$(git ls-remote --tags origin | awk -v tag="refs/tags/v$version" '$2 == tag "^{}" { peeled = $1 } $2 == tag { plain = $1 } END { print (peeled != "" ? peeled : plain) }')
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag v$version already exists at $existing. Bump VERSION (and add the CHANGELOG section) before releasing again." >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building Rubban $version from $GITHUB_SHA"
  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: go run ./cmd/buildtool fetch-tools win32 x64 tools-dl
      - run: go run ./cmd/buildtool package --os windows
        env:
          RUBBAN_BUNDLE_KUBECTL: tools-dl/kubectl.exe
          RUBBAN_BUNDLE_HELM: tools-dl/helm.exe
      - name: Regression test the release cycle (zip, update helper, installer, install, migration, in-app update, uninstall)
        shell: pwsh
        run: ./scripts/regression.ps1 -Release release -Work "$env:RUNNER_TEMP\rubban-regression" -KeepWork
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: regression-windows
          path: ${{ runner.temp }}/rubban-regression/out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-windows
          path: |
            release/*.zip
            release/*.exe
  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - run: |
          go run ./cmd/buildtool fetch-tools darwin arm64 tools-arm64
          go run ./cmd/buildtool fetch-tools darwin x64 tools-x64
      - run: go run ./cmd/buildtool package --os darwin --arch arm64
        env:
          RUBBAN_BUNDLE_KUBECTL: tools-arm64/kubectl
          RUBBAN_BUNDLE_HELM: tools-arm64/helm
      - run: go run ./cmd/buildtool package --os darwin --arch x64
        env:
          RUBBAN_BUNDLE_KUBECTL: tools-x64/kubectl
          RUBBAN_BUNDLE_HELM: tools-x64/helm
      - name: Smoke test the arm64 build
        env:
          RUBBAN_DISABLE_UPDATES: '1'
          RUBBAN_DATA_DIR: /tmp/smoke-data
          RUBBAN_SMOKE_DIR: /tmp/smoke-out
        run: |
          mkdir -p /tmp/smoke
          ditto -x -k release/Rubban-*-macOS-arm64.zip /tmp/smoke
          output=$(/tmp/smoke/*/Rubban.app/Contents/MacOS/Rubban --smoke-test)
          echo "$output"
          echo "$output" | grep -q '"rendererErrors":\[\]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: smoke-macos
          path: /tmp/smoke-out
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-macos
          path: release/*.zip
  publish:
    if: ${{ inputs.publish }}
    needs: [check, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - run: go run ./cmd/buildtool write-manifest release
      - run: go run ./cmd/buildtool release-notes "${{ needs.check.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: Rubban ${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/*
          body_path: notes.md
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
